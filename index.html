    <button class="close-btn" id="lightboxClose" aria-label="Close gallery">Close</button>
    <div class="content" id="lightboxContent" role="dialog" aria-modal="true"></div>
    <div class="caption" id="lightboxCaption" style="display:none"></div>
  </div>

  <script>
  (function(){
    // Edit this list to match the exact filenames you uploaded (case-sensitive)
    const expectedFiles = [
      'gallery1.png',
      'gallery2.png'
    ];

    // Base paths to try (checks both locations)
    const basePaths = [
      'assets/gallery/',
      'assets/'
    ];

    const grid = document.getElementById('galleryGrid');
    const missing = [];

    function testImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve({ ok: true, type: 'image', src });
        img.onerror = () => resolve({ ok: false, type: 'image', src });
        img.src = src + '?_=' + Date.now();
      });
    }

    async function testVideo(src) {
      try {
        const res = await fetch(src, { method: 'HEAD' });
        return { ok: res.ok, type: 'video', src, status: res.status };
      } catch (e) {
        return { ok: false, type: 'video', src, error: e.message };
      }
    }

    function renderThumbnail(item) {
      if (item.type === 'image') {
        const el = document.createElement('img');
        el.src = item.src;
        el.alt = '';
        el.loading = 'lazy';
        el.dataset.full = item.src;
        grid.appendChild(el);
      } else if (item.type === 'video') {
        const v = document.createElement('video');
        v.controls = false;
        v.muted = true;
        v.preload = 'metadata';
        v.dataset.full = item.src;
        const s = document.createElement('source');
        s.src = item.src;
        s.type = 'video/mp4';
        v.appendChild(s);
        grid.appendChild(v);
      }
    }

    (async function runChecks() {
      for (const name of expectedFiles) {
        let found = false;
        for (const base of basePaths) {
          const full = base + name;
          const ext = name.split('.').pop().toLowerCase();
          let result;
          if (['mp4','webm','ogg'].includes(ext)) {
            result = await testVideo(full);
          } else {
            result = await testImage(full);
          }

          if (result.ok) {
            renderThumbnail(result);
            found = true;
            break;
          }
        }
        if (!found) missing.push(name);
      }

      if (missing.length) {
        console.warn('Gallery: missing files (check assets/ and assets/gallery/ and filename case):', missing);
        const note = document.createElement('div');
        note.style.color = '#f1c40f';
        note.style.padding = '12px';
        note.textContent = 'Some gallery files are missing. Check console for filenames.';
        grid.appendChild(note);
      } else {
        console.info('Gallery: all expected files loaded successfully.');
      }
    })();

    // Lightbox behavior
    const lightbox = document.getElementById('galleryLightbox');
    const content = document.getElementById('lightboxContent');
    const closeBtn = document.getElementById('lightboxClose');

    grid.addEventListener('click', (e) => {
      const target = e.target.closest('img, video');
      if (!target) return;
      content.innerHTML = '';

      if (target.tagName.toLowerCase() === 'img') {
        const img = document.createElement('img');
        img.src = target.dataset.full || target.src;
        img.alt = target.alt || '';
        content.appendChild(img);
      } else {
        const vid = document.createElement('video');
        vid.controls = true;
        vid.autoplay = true;
        vid.playsInline = true;
        vid.style.maxHeight = '80vh';
        const s = document.createElement('source');
        s.src = target.dataset.full || (target.querySelector('source') && target.querySelector('source').src);
        s.type = 'video/mp4';
        vid.appendChild(s);
        content.appendChild(vid);
      }

      lightbox.style.display = 'flex';
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    });

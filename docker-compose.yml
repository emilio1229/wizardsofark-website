services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: woa
      POSTGRES_PASSWORD: woa
      POSTGRES_DB: woa
    ports:
      - "5432:5432"
    volumes:
      - woa-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woa -d woa"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://woa:woa@postgres:5432/woa?schema=public
      FRONTEND_URL: http://localhost:8080
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      SERVER_NAME_FILTER: The Wizards Of Ark
      ARK_SERVER_POLL_INTERVAL: "60000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        # Same-origin via nginx proxy on :8080
        VITE_API_URL: /api/v1
        VITE_WS_URL: ""
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      API_UPSTREAM: api:3001
    depends_on:
      - api
    restart: unless-stopped

  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  woa-postgres:

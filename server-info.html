<!-- ⭐⭐⭐ WORKING BATTLEMETRICS SCRIPT ⭐⭐⭐ -->
<script>
const servers = {
  Island: { id: 36234320, max: 40 },
  Scorched: { id: 36350599, max: 40 },
  Aberration: { id: 36350590, max: 40 },
  Ragnarok: { id: 36622475, max: 40 },
  Valguero: { id: 34584004, max: 40 },
  Center: { id: 37460528, max: 40 },
  Extinction: { id: 37877926, max: 40 },
  Gen1: { id: 39624576, max: 40 },
  LostColony: { id: 38673826, max: 40 },
  Astraeos: { id: 36923428, max: 40 },
  Amissa: { id: 37736125, max: 40 },
  Bjarnheim: { id: 40500451, max: 40 },
  Event: { id: 40597866, max: 20 },
  PvP: { id: 39193910, max: 20 }
};

function openPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(name).style.display = 'block';
  event.target.classList.add('active');
}

async function loadStatus() {
  for (const key in servers) {
    const server = servers[key];
    const panel = document.getElementById(key);

    try {
      const response = await fetch(
        `https://proxy.cors.sh/https://api.battlemetrics.com/servers/${server.id}`,
        { headers: { "x-cors-api-key": "temp" } }
      );

      const data = await response.json();
      const status = data.data.attributes.status;
      const players = data.data.attributes.players;

      panel.innerHTML = `
        <h2>${key.replace(/([A-Z])/g, ' $1').trim()}</h2>
        <div class="status ${status === 'online' ? 'online' : 'offline'}">
          Status: ${status === 'online' ? '🟢 Online' : '🔴 Offline'}
        </div>
        <div class="status">Players: ${players} / ${server.max}</div>
      `;
    } catch (e) {
      panel.innerHTML = `
        <h2>${key}</h2>
        <div class="status offline">Unable to load server data.</div>
      `;
    }
  }
}

window.onload = loadStatus;
</script>

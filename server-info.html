<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

<body>

<header class="site-header">
  <div class="logo-wrap">
    <img src="assets/logo.png" class="logo">
  </div>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="store.html">Store</a>
    <a href="server-info.html" class="active">Server Info</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main class="main">

  <section class="content-block">
    <h1>Server Status</h1>
    <p id="server-status">Checking server status...</p>
    <p id="player-count">Loading player count...</p>
  </section>

  <script>
    fetch("https://api.battlemetrics.com/servers/YOUR_BATTLEMETRICS_ID")
      .then(r => r.json())
      .then(data => {
        const status = data.data.attributes.status;
        const players = data.data.attributes.players;
        const max = data.data.attributes.maxPlayers;

        document.getElementById("server-status").innerText =
          status === "online" ? "🟢 Online" : "🔴 Offline";

        document.getElementById("player-count").innerText =
          `Players Online: ${players}/${max}`;
      })
      .catch(() => {
        document.getElementById("server-status").innerText = "⚠ Unable to fetch status";
        document.getElementById("player-count").innerText = "";
      });
  </script>

  <section class="content-block">
    <h2>Discord Community</h2>
    <iframe src="https://discord.com/widget?id=1428105944373526610&theme=dark"
            width="100%" height="400"
            allowtransparency="true"
            frameborder="0"></iframe>
  </section>

  <section class="content-block">

    </ul>
  </section>

</main>

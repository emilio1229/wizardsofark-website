  <!-- ⭐ UPGRADED ARCANE SERVER STATUS CSS ⭐ -->
  <style>
    /* Arcane Title */
    .arcane-title {
      font-size: 42px;
      text-align: center;
      color: #c9a86a;
      text-shadow: 0 0 12px #5a3e1b, 0 0 25px #c9a86a;
      margin-bottom: 20px;
    }

    /* Tabs */
    .tab-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      background: #111522;
      padding: 10px;
      border-bottom: 2px solid #c9a86a;
      box-shadow: 0 0 20px #000 inset;
      margin-top: 40px;
    }

    .tab {
      padding: 10px 18px;
      margin: 5px;
      background: #1a1f2e;
      border: 1px solid #c9a86a;
      border-radius: 6px;
      cursor: pointer;
      color: #c9a86a;
      font-size: 16px;
      transition: 0.3s;
    }

    .tab:hover {
      background: #2a3147;
      box-shadow: 0 0 12px #c9a86a;
    }

    .tab.active {
      background: #c9a86a;
      color: #0b0f19;
      box-shadow: 0 0 15px #c9a86a;
    }

    /* Panels */
    .panel {
      display: none;
      padding: 20px;
      margin: 20px auto;
      width: 90%;
      max-width: 800px;
      background: #0d0f17;
      border: 2px solid #c9a86a;
      border-radius: 12px;
      box-shadow: 0 0 25px #c9a86a55, inset 0 0 10px #000;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Status Colors */
    .online { color: #4caf50; }
    .offline { color: #f44336; }
  </style>
</head>

<!-- ⭐⭐⭐ UPGRADED SERVER STATUS SCRIPT ⭐⭐⭐ -->
<script>
const servers = {
  Island: { id: 36234320, max: 40 },
  Scorched: { id: 36350599, max: 40 },
  Aberration: { id: 36350590, max: 40 },
  Ragnarok: { id: 36622475, max: 40 },
  Valguero: { id: 34584004, max: 40 },
  Center: { id: 37460528, max: 40 },
  Extinction: { id: 37877926, max: 40 },
  Gen1: { id: 39624576, max: 40 },
  LostColony: { id: 38673826, max: 40 },
  Astraeos: { id: 36923428, max: 40 },
  Amissa: { id: 37736125, max: 40 },
  Bjarnheim: { id: 40500451, max: 40 },
  Event: { id: 40597866, max: 20 },
  PvP: { id: 39193910, max: 20 }
};

function openPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(name).style.display = 'block';
  event.target.classList.add('active');
}

async function loadStatus() {
  for (const key in servers) {
    const server = servers[key];
    const panel = document.getElementById(key);

    try {
      const response = await fetch(
        `https://cors.isomorphic-git.org/https://api.battlemetrics.com/servers/${server.id}`
      );
      const data = await response.json();

      const status = data.data.attributes.status;
      const players = data.data.attributes.players;

      panel.innerHTML = `
        <h2>${key.replace(/([A-Z])/g, ' $1').trim()}</h2>
        <div class="status ${status === 'online' ? 'online' : 'offline'}">
          Status: ${status === 'online' ? '🟢 Online' : '🔴 Offline'}
        </div>
        <div class="status">Players: ${players} / ${server.max}</div>
        <div class="status">BattleMetrics ID: ${server.id}</div>
      `;
    } catch (e) {
      panel.innerHTML = `
        <h2>${key}</h2>
        <div class="status offline">Unable to load server data.</div>
      `;
    }
  }
}

window.onload = loadStatus;
</script>

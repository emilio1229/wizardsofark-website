"$schema" = "https://railway.com/railway.schema.json"

# IMPORTANT (monorepo):
# Do NOT set dockerfilePath or startCommand here.
# Railway applies this file to every service and will overwrite woa-web
# back to the API image on each deploy.
#
# Set these in each service dashboard instead:
#   woa-api  → Settings → Build → Dockerfile path: docker/Dockerfile.api
#              Settings → Deploy → Start command:  (leave empty; image CMD runs ./start.sh)
#              Settings → Deploy → Healthcheck:    /health
#   woa-web  → Settings → Build → Dockerfile path: docker/Dockerfile.web
#              Settings → Deploy → Start command:  (empty)
#              Settings → Deploy → Healthcheck:    /health
#              Optional config file: docker/railway.web.toml

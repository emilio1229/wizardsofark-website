"$schema" = "https://railway.com/railway.schema.json"

# Default for the API service only.
# For woa-web: Settings → Config-as-code → docker/railway.web.toml
# (Do not put startCommand here — it applies to every service using this file
# and makes the web service crash. API start comes from docker/Dockerfile.api CMD.)

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile.api"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
